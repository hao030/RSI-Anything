[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-anything"
version = "0.2.0"
description = "A shared RSI workflow for code repair and GUI adaptation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rsi = "rsi_anything.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsi_anything = ["catalogs/*.json"]
