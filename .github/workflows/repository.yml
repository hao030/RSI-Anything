name: Repository integrity
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: rsi plan --config configs/code_repair/default.json
      - run: rsi plan --config configs/gui/default.json
      - run: python scripts/verify_repository.py
      - name: Check laboratory inference
        run: |
          python -m pip install numpy==2.2.6
          python tasks/laboratory_planning/infer.py world --help
          python tasks/laboratory_planning/infer.py select --help
          python -m unittest discover -s tasks/laboratory_planning/tests -v
      - name: Check reaction optimization
        run: |
          python -m pip install -r tasks/reaction_optimization/requirements.txt
          python -m unittest discover -s tasks/reaction_optimization/tests -v
          python tasks/reaction_optimization/scripts/verify_assets.py
