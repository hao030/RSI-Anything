name: GUI checks
on:
  push:
    branches: ['**']
    paths:
      - 'tasks/gui/**'
      - 'src/rsi_anything/**'
      - 'configs/gui/**'
      - 'tasks/code_repair/vendor/jepa-anything-core/**'
      - '.github/workflows/gui.yml'
      - '.gitignore'
  pull_request:
    paths:
      - 'tasks/gui/**'
      - 'src/rsi_anything/**'
      - 'configs/gui/**'
      - 'tasks/code_repair/vendor/jepa-anything-core/**'
      - '.github/workflows/gui.yml'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: tasks/gui
jobs:
  browser-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 build
      - run: python -m pip install -e '.[browser,test]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip install -e ../..
      - run: |
          python -c "import json; from pathlib import Path; p=Path('../../configs/gui/smoke.json'); d=json.loads(p.read_text()); d['python']='current'; p.with_name('smoke-ci.json').write_text(json.dumps(d))"
          rsi run --config ../../configs/gui/smoke-ci.json
          rsi run --config ../../configs/gui/smoke-ci.json --resume
      - run: python -m pytest
        env:
          RSI_TEST_BROWSER: '1'
      - run: python scripts/reproduce_reported_statistics.py
      - run: python scripts/verify_release.py
      - run: python -m build
